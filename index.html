<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Saat ve Hava Durumu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", Arial, sans-serif; color: #ffffff; }
  .box { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 4vmin; box-sizing: border-box; padding: 2vmin; }
  .time-block { display: flex; flex-direction: column; align-items: flex-start; }
  #time { font-size: 30vmin; font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  #date { font-size: 8vmin; font-weight: 400; margin-top: 2vmin; opacity: 0.92; white-space: nowrap; }
  .divider { width: 0.4vmin; align-self: stretch; background: rgba(255,255,255,0.35); margin: 4vmin 0; }
  .weather-block { display: flex; flex-direction: column; align-items: center; }
  #icon { font-size: 20vmin; line-height: 1; }
  #temp { font-size: 20vmin; font-weight: 700; line-height: 1; margin-top: 1vmin; }
  #desc { font-size: 7vmin; margin-top: 1.5vmin; opacity: 0.92; white-space: nowrap; }
  #city { font-size: 6vmin; opacity: 0.75; margin-top: 0.5vmin; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="box">
  <div class="time-block">
    <div id="time">--:--</div>
    <div id="date">&nbsp;</div>
  </div>
  <div class="divider"></div>
  <div class="weather-block">
    <div id="icon">⛅</div>
    <div id="temp">--°</div>
    <div id="desc">Yükleniyor</div>
    <div id="city">ALANYA</div>
  </div>
</div>

<script>
(function () {
  var TZ = "Europe/Istanbul";
  var LAT = 36.5436, LON = 31.9998; // Alanya

  function tick() {
    var now = new Date();
    document.getElementById("time").textContent =
      new Intl.DateTimeFormat("tr-TR", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TZ }).format(now);
    document.getElementById("date").textContent =
      new Intl.DateTimeFormat("tr-TR", { weekday: "long", day: "numeric", month: "long", timeZone: TZ }).format(now);
  }
  tick();
  setInterval(tick, 1000);

  function describe(code) {
    if (code === 0) return ["☀️", "Açık"];
    if (code === 1) return ["🌤️", "Az bulutlu"];
    if (code === 2) return ["⛅", "Parçalı bulutlu"];
    if (code === 3) return ["☁️", "Bulutlu"];
    if (code === 45 || code === 48) return ["🌫️", "Sisli"];
    if (code >= 51 && code <= 57) return ["🌦️", "Çisenti"];
    if (code >= 61 && code <= 67) return ["🌧️", "Yağmurlu"];
    if (code >= 71 && code <= 77) return ["❄️", "Karlı"];
    if (code >= 80 && code <= 82) return ["🌦️", "Sağanak"];
    if (code === 85 || code === 86) return ["❄️", "Kar sağanağı"];
    if (code >= 95) return ["⛈️", "Fırtına"];
    return ["⛅", ""];
  }

  function loadWeather() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
              "&current=temperature_2m,weather_code&timezone=" + encodeURIComponent(TZ);
    fetch(url, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var c = d.current;
        var w = describe(c.weather_code);
        document.getElementById("icon").textContent = w[0];
        document.getElementById("temp").textContent = Math.round(c.temperature_2m) + "°";
        document.getElementById("desc").textContent = w[1];
      })
      .catch(function () { /* internet yoksa son değer ekranda kalır */ });
  }
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
})();
</script>
</body>
</html>
