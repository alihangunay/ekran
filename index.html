<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Saat ve Hava Durumu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --navy: #12265A;
    --blue: #2F6FDB;
    --sky: #8DB4F0;
    --muted: #3C4F82;
    --u: min(1vh, 0.15vw);
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--navy); }
  .box { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 12); }
  .card { display: flex; align-items: center; gap: calc(var(--u) * 7); }
  .divider { width: calc(var(--u) * 0.9); height: calc(var(--u) * 70); background: linear-gradient(to bottom, transparent, var(--sky), transparent); border-radius: 99px; }
  .icon { width: calc(var(--u) * 66); height: calc(var(--u) * 66); flex: none; }
  .icon svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .txt { display: flex; flex-direction: column; justify-content: center; }
  #time { font-size: calc(var(--u) * 50); font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--navy); }
  #dm { font-size: calc(var(--u) * 28); font-weight: 700; line-height: 1.1; color: var(--navy); white-space: nowrap; }
  #wd { font-size: calc(var(--u) * 28); font-weight: 700; line-height: 1.1; margin-top: 0; color: var(--blue); white-space: nowrap; }
  #temp { font-size: calc(var(--u) * 50); font-weight: 700; line-height: 1; color: var(--navy); }

  /* saat simgesi */
  .hand { transform-origin: 50px 50px; }
  #sec { transition: transform 0.3s cubic-bezier(.4,2.2,.5,1); }
  .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 50px 50px; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .0; transform: scale(1.12); } }

  /* hava durumu animasyonları */
  .spin { animation: spin 18s linear infinite; transform-origin: 50px 50px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .glow { animation: glow 3s ease-in-out infinite; transform-origin: 50px 50px; }
  @keyframes glow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .drift { animation: drift 6s ease-in-out infinite; }
  .drift2 { animation: drift 8s ease-in-out infinite reverse; }
  @keyframes drift { 0%,100% { transform: translateX(-3px); } 50% { transform: translateX(4px); } }
  .drop { animation: drop 1.1s linear infinite; }
  .drop:nth-child(2) { animation-delay: .35s; }
  .drop:nth-child(3) { animation-delay: .7s; }
  @keyframes drop { 0% { transform: translateY(-4px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
  .flake { animation: flake 2.4s linear infinite; }
  .flake:nth-child(2) { animation-delay: .8s; }
  .flake:nth-child(3) { animation-delay: 1.6s; }
  @keyframes flake { 0% { transform: translate(0,-4px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(3px,14px); opacity: 0; } }
  .bolt { animation: bolt 2.2s linear infinite; }
  @keyframes bolt { 0%,60%,100% { opacity: 1; } 65% { opacity: .15; } 70% { opacity: 1; } 75% { opacity: .2; } }
  .twinkle { animation: tw 2.5s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .fogline { animation: drift 5s ease-in-out infinite; }
  .bob { animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .ring { animation: ring 3s ease-in-out infinite; transform-origin: 50px 50px; }
  @keyframes ring { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="box">

  <!-- SAAT -->
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 100 100">
        <circle class="pulse" cx="50" cy="50" r="46" fill="none" stroke="#2F6FDB" stroke-width="3"/>
        <circle cx="50" cy="50" r="42" fill="#FFFFFF" stroke="#12265A" stroke-width="6"/>
        <circle cx="50" cy="50" r="35" fill="#EAF1FD"/>
        <g stroke="#12265A" stroke-linecap="round" stroke-width="3">
          <line x1="50" y1="19" x2="50" y2="25"/><line x1="50" y1="75" x2="50" y2="81"/>
          <line x1="19" y1="50" x2="25" y2="50"/><line x1="75" y1="50" x2="81" y2="50"/>
        </g>
        <g stroke="#8DB4F0" stroke-linecap="round" stroke-width="2">
          <line x1="65.5" y1="23.2" x2="62.5" y2="28.4"/><line x1="76.8" y1="34.5" x2="71.6" y2="37.5"/>
          <line x1="76.8" y1="65.5" x2="71.6" y2="62.5"/><line x1="65.5" y1="76.8" x2="62.5" y2="71.6"/>
          <line x1="34.5" y1="76.8" x2="37.5" y2="71.6"/><line x1="23.2" y1="65.5" x2="28.4" y2="62.5"/>
          <line x1="23.2" y1="34.5" x2="28.4" y2="37.5"/><line x1="34.5" y1="23.2" x2="37.5" y2="28.4"/>
        </g>
        <line id="hh" class="hand" x1="50" y1="50" x2="50" y2="33" stroke="#12265A" stroke-width="5" stroke-linecap="round"/>
        <line id="mh" class="hand" x1="50" y1="50" x2="50" y2="24" stroke="#12265A" stroke-width="3.5" stroke-linecap="round"/>
        <line id="sec" class="hand" x1="50" y1="56" x2="50" y2="21" stroke="#2F6FDB" stroke-width="2" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="4" fill="#2F6FDB"/>
      </svg>
    </div>
    <div class="txt">
      <div id="time">--:--</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- TARİH -->
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 100 100" class="bob">
        <rect x="12" y="16" width="76" height="72" rx="12" fill="#FFFFFF" stroke="#12265A" stroke-width="6"/>
        <path d="M12 28a12 12 0 0 1 12-12h52a12 12 0 0 1 12 12v14H12z" fill="#2F6FDB" stroke="#12265A" stroke-width="6" stroke-linejoin="round"/>
        <g class="ring"><rect x="30" y="6" width="8" height="20" rx="4" fill="#12265A"/><rect x="62" y="6" width="8" height="20" rx="4" fill="#12265A"/></g>
        <text id="dayn" x="50" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#12265A">--</text>
      </svg>
    </div>
    <div class="txt">
      <div id="dm">&nbsp;</div>
      <div id="wd">&nbsp;</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- HAVA DURUMU -->
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 100 100" id="wx">
        <!-- GÜNEŞ -->
        <g id="w-sun" class="hidden">
          <g class="glow"><circle cx="50" cy="50" r="19" fill="#FFC83D"/><circle cx="50" cy="50" r="19" fill="none" stroke="#FFB300" stroke-width="2"/></g>
          <g class="spin" stroke="#FFB300" stroke-width="5" stroke-linecap="round">
            <line x1="50" y1="14" x2="50" y2="22"/><line x1="50" y1="78" x2="50" y2="86"/>
            <line x1="14" y1="50" x2="22" y2="50"/><line x1="78" y1="50" x2="86" y2="50"/>
            <line x1="24.5" y1="24.5" x2="30" y2="30"/><line x1="70" y1="70" x2="75.5" y2="75.5"/>
            <line x1="24.5" y1="75.5" x2="30" y2="70"/><line x1="70" y1="30" x2="75.5" y2="24.5"/>
          </g>
        </g>
        <!-- AY -->
        <g id="w-moon" class="hidden">
          <g class="glow"><path d="M62 18a32 32 0 1 0 20 52A27 27 0 0 1 62 18z" fill="#F4D77A" stroke="#E0B84A" stroke-width="2" stroke-linejoin="round"/></g>
          <circle class="twinkle" cx="78" cy="26" r="3" fill="#FFC83D"/>
          <circle class="twinkle" style="animation-delay:.8s" cx="86" cy="42" r="2" fill="#FFC83D"/>
          <circle class="twinkle" style="animation-delay:1.5s" cx="68" cy="12" r="2" fill="#FFC83D"/>
        </g>
        <!-- KÜÇÜK GÜNEŞ (bulut arkası) -->
        <g id="w-minisun" class="hidden">
          <g class="glow"><circle cx="64" cy="36" r="15" fill="#FFC83D"/></g>
          <g class="spin" style="transform-origin:64px 36px" stroke="#FFB300" stroke-width="4" stroke-linecap="round">
            <line x1="64" y1="9" x2="64" y2="15"/><line x1="64" y1="57" x2="64" y2="63"/>
            <line x1="37" y1="36" x2="43" y2="36"/><line x1="85" y1="36" x2="91" y2="36"/>
            <line x1="45" y1="17" x2="49" y2="21"/><line x1="79" y1="51" x2="83" y2="55"/>
            <line x1="45" y1="55" x2="49" y2="51"/><line x1="79" y1="21" x2="83" y2="17"/>
          </g>
        </g>
        <!-- BULUT -->
        <g id="w-cloud" class="hidden">
          <g class="drift">
            <path d="M28 70a15 15 0 0 1 2-29.8A20 20 0 0 1 68 36a17 17 0 0 1 4 33.8z" fill="#FFFFFF" stroke="#12265A" stroke-width="4" stroke-linejoin="round"/>
          </g>
        </g>
        <!-- YAĞMUR -->
        <g id="w-rain" class="hidden">
          <g stroke="#2F6FDB" stroke-width="4.5" stroke-linecap="round">
            <line class="drop" x1="34" y1="76" x2="31" y2="84"/>
            <line class="drop" x1="50" y1="76" x2="47" y2="84"/>
            <line class="drop" x1="66" y1="76" x2="63" y2="84"/>
          </g>
        </g>
        <!-- KAR -->
        <g id="w-snow" class="hidden">
          <g fill="#8DB4F0">
            <circle class="flake" cx="34" cy="80" r="3.5"/>
            <circle class="flake" cx="50" cy="80" r="3.5"/>
            <circle class="flake" cx="66" cy="80" r="3.5"/>
          </g>
        </g>
        <!-- ŞİMŞEK -->
        <g id="w-bolt" class="hidden">
          <path class="bolt" d="M54 62 L42 80 L51 80 L46 94 L62 74 L53 74 L58 62 z" fill="#FFB300" stroke="#E08A00" stroke-width="1.5" stroke-linejoin="round"/>
        </g>
        <!-- SİS -->
        <g id="w-fog" class="hidden">
          <g stroke="#8DB4F0" stroke-width="5" stroke-linecap="round">
            <line class="fogline" x1="22" y1="76" x2="78" y2="76"/>
            <line class="fogline" style="animation-delay:-2s" x1="30" y1="86" x2="86" y2="86"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="txt">
      <div id="temp">--°</div>
    </div>
  </div>

</div>

<script>
(function () {
  var TZ = "Europe/Istanbul";
  var LAT = 36.5436, LON = 31.9998; // Alanya
  function $(id) { return document.getElementById(id); }

  function tick() {
    var now = new Date();
    var p = new Intl.DateTimeFormat("en-GB", { hour: "numeric", minute: "numeric", second: "numeric", hour12: false, timeZone: TZ }).formatToParts(now);
    var h = 0, m = 0, s = 0;
    p.forEach(function (x) { if (x.type === "hour") h = +x.value % 24; if (x.type === "minute") m = +x.value; if (x.type === "second") s = +x.value; });
    $("time").textContent = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
    var dp = new Intl.DateTimeFormat("tr-TR", { weekday: "long", day: "numeric", month: "long", timeZone: TZ }).formatToParts(now);
    var dd = "", mm = "", ww = "";
    dp.forEach(function (x) { if (x.type === "day") dd = x.value; if (x.type === "month") mm = x.value; if (x.type === "weekday") ww = x.value; });
    $("dayn").textContent = dd;
    $("dm").textContent = dd + " " + mm;
    $("wd").textContent = ww;
    $("hh").style.transform = "rotate(" + (((h % 12) + m / 60) * 30) + "deg)";
    $("mh").style.transform = "rotate(" + ((m + s / 60) * 6) + "deg)";
    $("sec").style.transform = "rotate(" + (s * 6) + "deg)";
  }
  tick();
  setInterval(tick, 1000);

  var LAYERS = ["w-sun", "w-moon", "w-minisun", "w-cloud", "w-rain", "w-snow", "w-bolt", "w-fog"];
  function show(list) {
    LAYERS.forEach(function (id) { $(id).classList.toggle("hidden", list.indexOf(id) < 0); });
  }

  function render(code, isDay) {
    var text = "", layers = [];
    var clear = isDay ? ["w-sun"] : ["w-moon"];
    var part = isDay ? ["w-minisun", "w-cloud"] : ["w-moon", "w-cloud"];
    if (code === 0) { text = isDay ? "Güneşli" : "Açık"; layers = clear; }
    else if (code === 1) { text = "Az bulutlu"; layers = part; }
    else if (code === 2) { text = "Parçalı bulutlu"; layers = part; }
    else if (code === 3) { text = "Bulutlu"; layers = ["w-cloud"]; }
    else if (code === 45 || code === 48) { text = "Sisli"; layers = ["w-cloud", "w-fog"]; }
    else if (code >= 51 && code <= 57) { text = "Çisenti"; layers = ["w-cloud", "w-rain"]; }
    else if (code >= 61 && code <= 67) { text = "Yağmurlu"; layers = ["w-cloud", "w-rain"]; }
    else if (code >= 71 && code <= 77) { text = "Karlı"; layers = ["w-cloud", "w-snow"]; }
    else if (code >= 80 && code <= 82) { text = "Sağanak"; layers = ["w-cloud", "w-rain"]; }
    else if (code === 85 || code === 86) { text = "Kar sağanağı"; layers = ["w-cloud", "w-snow"]; }
    else if (code >= 95) { text = "Fırtınalı"; layers = ["w-cloud", "w-bolt"]; }
    else { text = ""; layers = ["w-cloud"]; }
    show(layers);
  }

  function loadWeather() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
              "&current=temperature_2m,weather_code,is_day&timezone=" + encodeURIComponent(TZ);
    fetch(url, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var c = d.current;
        $("temp").textContent = Math.round(c.temperature_2m) + "°";
        render(c.weather_code, c.is_day === 1);
      })
      .catch(function () { /* internet yoksa son değer kalır */ });
  }
  render(2, true);
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
})();
</script>
</body>
</html>
