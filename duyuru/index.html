<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Duyuru</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Poppins", "Segoe UI", Arial, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 120px; background: transparent; transform-origin: 0 0; }
  .view { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; }
  .view.on { opacity: 1; }
  #duyuru { display: flex; align-items: center; background: #172a52; }
  #dicon { flex: none; margin-left: 64px; width: 56px; height: 56px; }
  #dwrap { flex: 1; overflow: hidden; margin: 0 64px 0 28px; white-space: nowrap; }
  #dtext { display: inline-block; color: #fff; font-weight: 600; font-size: 42px; line-height: 120px; }
  #dtext.scroll { animation: marq var(--dur, 20s) linear infinite; padding-left: 100%; }
  @keyframes marq { from { transform: translateX(0); } to { transform: translateX(-100%); } }
</style>
</head>
<body>
<div id="stage">
  <div id="duyuru" class="view">
    <svg id="dicon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
    </svg>
    <div id="dwrap"><span id="dtext"></span></div>
  </div>
</div>
<script>
(function () {
  function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
  }
  fit(); window.addEventListener("resize", fit);

  var duy = document.getElementById("duyuru"), dt = document.getElementById("dtext"), last = null;

  function apply(d) {
    var aktif = d && d.aktif === true && typeof d.metin === "string" && d.metin.trim() !== "";
    var key = aktif ? d.metin : "";
    if (key === last) return;
    last = key;
    if (aktif) {
      dt.className = ""; dt.style.removeProperty("--dur"); dt.textContent = d.metin.trim();
      var wrap = document.getElementById("dwrap");
      if (dt.offsetWidth > wrap.clientWidth) {
        dt.className = "scroll";
        dt.style.setProperty("--dur", Math.max(12, (dt.offsetWidth + wrap.clientWidth) / 110) + "s");
      }
      duy.classList.add("on");
    } else {
      duy.classList.remove("on");
    }
  }

  function load() {
    fetch("duyuru.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(apply)
      .catch(function () { /* hata olursa mevcut görünüm kalır */ });
  }
  load();
  setInterval(load, 60 * 1000);
})();
</script>
</body>
</html>
